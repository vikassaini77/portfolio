<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #f7f7f7;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  overflow: hidden;
}

.thank-you-container {
  text-align: center;
}

.thank-you-message h1 {
  font-size: 3rem;
  color: #4CAF50;
  animation: fadeIn 2s ease-in-out;
}

.thank-you-message p {
  font-size: 1.2rem;
  color: #555;
  margin: 10px 0;
  animation: fadeIn 3s ease-in-out;
}

button {
  background-color: #4CAF50;
  color: white;
  padding: 10px 20px;
  font-size: 1rem;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

button:hover {
  background-color: #45a049;
}

.animation-container {
  position: relative;
  margin-top: 30px;
}

.heart {
  width: 100px;
  height: 100px;
  background-color: red;
  clip-path: polygon(50% 0%, 0% 35%, 50% 100%, 100% 35%);
  margin: 0 auto;
  animation: bounce 2s ease-in-out infinite;
}

@keyframes bounce {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-20px);
  }
}

@keyframes fadeIn {
  0% {
    opacity: 0;
  }
  100% {
    opacity: 1;
  }
}

  </style>
</head>
<body>
  <div class="thank-you-container">
    <div class="thank-you-message">
      <h1>Thank You!</h1>
      <p>Your action was successful. We appreciate your effort!</p>
      <button onclick="redirectHome('/indux.html')">Go to Home</button>
    </div>
    <div class="animation-container">
      <div class="heart"></div>
    </div>
  </div>

  <script src="script.js">
    function redirectHome(url) {
    window.location.href = "/indux.html";
}

document.addEventListener("DOMContentLoaded", () => {
    const heart = document.querySelector(".heart");
    if (heart) {
        heart.classList.add("animate-heart");
    }
});

  </script>
</body>
</html>
